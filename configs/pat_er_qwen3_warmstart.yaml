# Phase 2 warm-start PAT-ER config: Qwen3-0.6B decoder backbone + PAT-ER streams.
#
# The token backbone dims MATCH Qwen/Qwen3-0.6B exactly so a pretrained
# state_dict loads into the self-attn / FFN / norm / embedding params:
#   hidden 1024, 28 layers, 16 q-heads, 8 kv-heads, head_dim 128 (decoupled
#   from hidden//heads via attn_head_dim), intermediate 3072, q/k-norm on,
#   rope_theta 1e6, rms_norm_eps 1e-6, tied embeddings.
# The vocab stays the PAT-ER-extended Qwen tokenizer (151782); the warm-start
# loader copies the shared leading embedding rows from Qwen and random-inits
# the PAT-ER special-token rows (scripts/warmstart_from_qwen.py).
# The PAT-ER side-streams (event-role registers, primitive registers,
# cross-attn, role/primitive FFN adapters, aux heads, pressure heads) are
# random-init and identical in shape to the 450M recipe.
vocab_size: 151782
hidden_size: 1024
intermediate_size: 3072
num_hidden_layers: 28
num_attention_heads: 16
num_key_value_heads: 8
attn_head_dim: 128
use_qk_norm: true
max_position_embeddings: 1024
rope_theta: 1000000.0
rms_norm_eps: 1.0e-6
num_event_registers: 4
num_argument_registers: 6
num_primitive_registers: 14
num_proto_role_properties: 17
cross_attention_every_n_layers: 4
adapter_rank: 32
use_event_stream: true
use_primitive_stream: true
use_role_primitive_ffn: true
num_ffn_adapters: 6
pressure_rank: 32
tie_word_embeddings: true
bos_token_id: 151643
eos_token_id: 151645
pad_token_id: 151643
# Warm-start-safe injection: only z_event / z_prim feeds role/primitive fuse.
# Omits the pretrained residual x from the injection input, which would
# amplify role_fuse gradients 55x vs register_only and corrupt the LM
# in one Adam step at lr=1e-6 (Stage 4 negative result).
injection_fusion_mode: register_only
