# ~450M PAT-ER config for the production-tokenizer + long-context gate.
# Uses the PAT-ER-extended Qwen3-0.6B tokenizer (vocab 151782) at context 1024.
# With a 151782-row tied embedding the vocab table alone is ~155M params at
# hidden 1024, so the transformer body is sized to land total params near 450M.
# pad/eos are Qwen's; Qwen has no BOS, so bos_token_id reuses endoftext (encode
# uses add_special_tokens=False, so the value is cosmetic and never prepended).
vocab_size: 151782
hidden_size: 1024
intermediate_size: 2816
num_hidden_layers: 16
num_attention_heads: 16
num_key_value_heads: 4
max_position_embeddings: 1024
rope_theta: 1000000.0
rms_norm_eps: 1.0e-6
num_event_registers: 4
num_argument_registers: 6
num_primitive_registers: 14
num_proto_role_properties: 17
cross_attention_every_n_layers: 4
adapter_rank: 32
use_event_stream: true
use_primitive_stream: true
use_role_primitive_ffn: true
num_ffn_adapters: 6
pressure_rank: 32
tie_word_embeddings: true
bos_token_id: 151643
eos_token_id: 151645
pad_token_id: 151643
