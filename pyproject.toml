[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pat-er-model"
version = "0.1.0"
description = "First runnable prototype of PAT-ER: Primitive-Augmented Transformer with Event-Role Stream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

